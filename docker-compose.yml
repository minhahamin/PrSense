services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - chroma-data:/data
      - ./backend/app:/app/app  # dev hot-reload mount (remove in prod)
    environment:
      CHROMA_DIR: /data/chroma
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  chroma-data:
